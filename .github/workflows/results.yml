name: 指標結果の更新
on:
  schedule:
    - cron: "*/10 * * * *"   # 10分ごと(GitHubの混雑で遅れることあり)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: results
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/results.mjs
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "指標結果を更新" && git pull --rebase && git push)
