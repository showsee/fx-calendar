<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#0b1424">
<title>FX指標カレンダー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b1424;--panel:#111d33;--panel2:#16243f;--line:#22314f;--fg:#e6ecf7;--muted:#8a9ab8;--accent:#f2b33d;
  --up:#21c58b;--up-bg:rgba(33,197,139,.13);--dn:#ff5468;--dn-bg:rgba(255,84,104,.13);
  --r-us1:#ff4d6d;--r-us2:#ff7ab8;--r-us3:#ffa14a;--r-us4:#7cd35b;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --sans:"Noto Sans JP","Hiragino Sans","Yu Gothic UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);-webkit-text-size-adjust:100%}
body{padding:0 0 calc(40px + env(safe-area-inset-bottom))}
a{color:#7fb6ff}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:5;background:rgba(11,20,36,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:10px;padding:12px 0 8px}
h1{font-size:16px;margin:0;font-weight:700;letter-spacing:.02em;flex:1}
h1 small{color:var(--muted);font-weight:400;font-size:11px;margin-left:6px}
.datenav{display:flex;align-items:center;gap:6px}
.datenav button{background:var(--panel);border:1px solid var(--line);color:var(--fg);border-radius:8px;width:34px;height:32px;font-size:15px;cursor:pointer}
.datenav button:disabled{opacity:.3;cursor:default}
.datelbl{font-family:var(--mono);font-size:14px;min-width:92px;text-align:center;cursor:pointer}
.datelbl b{display:block;font-size:10px;font-family:var(--sans);color:var(--accent);font-weight:500;line-height:1}
.next[hidden]{display:none}
.next{display:flex;align-items:center;gap:10px;padding:8px 12px;margin-bottom:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;font-size:13px}
.next .cd{font-family:var(--mono);font-size:18px;color:var(--accent);font-weight:600;white-space:nowrap}
.next .nt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.next .lbl{color:var(--muted);font-size:11px;display:block}
.filters{display:flex;gap:6px;padding-bottom:10px;overflow-x:auto;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{flex:none;background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:5px 12px;font-size:12px;cursor:pointer;font-family:inherit}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg);font-weight:700}
.notes{margin:12px 0 4px;padding:10px 12px;border-left:3px solid var(--accent);background:var(--panel);border-radius:0 8px 8px 0;font-size:12.5px;color:#cdd6e8;line-height:1.7}
.notes div::before{content:"・";color:var(--accent)}
.src{font-size:11px;color:var(--muted);margin:6px 0 0}
.grp{display:grid;grid-template-columns:52px 1fr;gap:0 10px;margin-top:14px}
.tm{font-family:var(--mono);font-size:15px;font-weight:600;padding-top:12px;text-align:right;line-height:1.1}
.tm small{display:block;font-size:10px;color:var(--muted);font-weight:500;margin-top:3px}
.grp.past .tm{color:var(--muted)}
.grp.now .tm{color:var(--accent)}
.evs{display:flex;flex-direction:column;gap:8px;min-width:0}
.ev{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.grp.now .ev{border-color:rgba(242,179,61,.55);box-shadow:0 0 0 1px rgba(242,179,61,.2)}
.ev.speech{background:linear-gradient(0deg,var(--panel),var(--panel)) padding-box;border-left:3px solid #e8c547}
.ev.policy{border-left:3px solid #ff9b45}
.head{display:flex;gap:10px;align-items:flex-start;padding:11px 12px 9px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.flag{flex:none;padding-top:3px}
.fl{display:inline-block;width:22px;height:15px;border-radius:2px;object-fit:cover;vertical-align:-2px;box-shadow:0 0 0 1px rgba(255,255,255,.12)}
.ttl{flex:1;min-width:0;font-size:14px;line-height:1.45}
.ttl.e1{font-weight:700}
.ttl.e2{font-weight:700;color:#ff8a8a}
.ttl .cty{color:var(--muted);font-weight:500}
.rank{flex:none;min-width:34px;height:26px;padding:0 6px;border-radius:7px;display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:14px;border:1px solid currentColor}
.rank.r1{color:var(--r-us1);background:rgba(255,77,109,.12)}
.rank.r2{color:var(--r-us2);background:rgba(255,122,184,.1)}
.rank.r3{color:var(--r-us3);background:rgba(255,161,74,.1)}
.rank.r4{color:var(--r-us4);background:rgba(124,211,91,.1)}
.rank.r0{color:var(--muted);border-style:dashed}
.vals{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border-top:1px solid var(--line)}
.vals>div{background:var(--panel2);padding:6px 8px 7px;text-align:center;min-width:0}
.vals .k{font-size:10px;color:var(--muted);display:block}
.vals .v{font-family:var(--mono);font-size:14px;font-weight:600;white-space:nowrap}
.vals .lab{grid-column:1/-1;text-align:left;font-size:11px;color:var(--muted);padding:4px 10px;background:var(--panel)}
.res.up{background:var(--up-bg)}.res.up .v{color:var(--up)}
.res.dn{background:var(--dn-bg)}.res.dn .v{color:var(--dn)}
.res .tag{font-size:10px;font-weight:700;display:block;margin-top:1px}
.memo{border-top:1px solid var(--line);padding:7px 12px;font-size:12.5px;color:#cdd6e8;background:var(--panel2)}
.kids{border-top:1px dashed var(--line);font-size:12px}
.kids div{display:grid;grid-template-columns:1fr 70px 70px 70px;gap:6px;padding:5px 12px;align-items:center}
.kids div span{font-family:var(--mono);text-align:right;white-space:nowrap}
.kids div span:first-child{font-family:var(--sans);text-align:left;color:#cdd6e8;white-space:normal}
.kids .up{color:var(--up)}.kids .dn{color:var(--dn)}
.detail{display:none;border-top:1px solid var(--line);padding:10px 12px 12px;font-size:13px;line-height:1.75;color:#d5ddec}
.ev.open .detail{display:block}
.detail h4{margin:8px 0 2px;font-size:11.5px;color:var(--accent);font-weight:700;letter-spacing:.04em}
.detail h4:first-child{margin-top:0}
.detail p{margin:0}
.detail .after{background:var(--panel2);border-radius:8px;padding:8px 10px;margin-top:6px}
.links{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.links a{font-size:12px;border:1px solid var(--line);border-radius:6px;padding:2px 8px;text-decoration:none}
.more{font-size:11px;color:var(--muted);margin-left:auto;padding-left:6px;flex:none;align-self:center}
.ev.open .more{transform:rotate(180deg)}
.pastbar{margin-top:14px;text-align:center}
.pastbar button{background:transparent;border:1px dashed var(--line);color:var(--muted);border-radius:8px;padding:7px 14px;font-size:12px;cursor:pointer;font-family:inherit;width:100%}
.empty{padding:40px 0;text-align:center;color:var(--muted);font-size:14px}
footer{margin-top:28px;padding-top:14px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted);line-height:1.8}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;margin-bottom:8px}
@media (max-width:420px){
  .grp{grid-template-columns:44px 1fr;gap:0 8px}
  .tm{font-size:13px}
  .kids div{grid-template-columns:1fr 54px 54px 54px;gap:4px;padding:5px 10px}
}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <h1>FX指標カレンダー<small id="upd"></small></h1>
      <div class="datenav">
        <button id="prev" aria-label="前の日">‹</button>
        <div class="datelbl" id="datelbl" title="今日へ"></div>
        <button id="nextd" aria-label="次の日">›</button>
      </div>
    </div>
    <div class="next" id="next" hidden></div>
    <div class="filters" id="filters"></div>
  </div>
</header>
<main class="wrap" id="main"><div class="empty">読み込み中…</div></main>
<div class="wrap">
<footer>
  <div class="legend">
    <span>米国: <b style="color:var(--r-us1)">SS S</b> › <b style="color:var(--r-us2)">AA A</b> › <b style="color:var(--r-us3)">BB B</b> › <b style="color:var(--r-us4)">C</b></span>
    <span>その他: <b style="color:var(--r-us2)">◎ ○</b> › <b style="color:var(--r-us3)">△</b> › <b style="color:var(--r-us4)">×</b></span>
  </div>
  時刻は日本時間(24時以降は翌日の早朝)。結果の<span style="color:var(--up)">緑</span>=予想より上、<span style="color:var(--dn)">赤</span>=予想より下(通貨の上げ下げではありません)。<br>
  出典: スケジュール・指標ランク・予想値 = <a id="srclink" href="https://kissfx.com/" target="_blank" rel="noopener">羊飼いのFXブログ</a> /
  結果 = <a href="https://www.sbifxt.co.jp/market/economic_calendar.html" target="_blank" rel="noopener">SBI FXトレード</a>(発表前後は15秒ごとに取得)・<a href="https://fx.minkabu.jp/indicators" target="_blank" rel="noopener">みんかぶFX</a> / 前回発表時の値動き = みんかぶFX / 内容・影響の解説 = 独自作成。<br>
  個人用の閲覧ページです。投資判断はご自身で行ってください。
</footer>
</div>
<script type="module">
import { parseSbi, sbiUrl, applyRows } from "./scripts/match.mjs";
const CC={"米":"us","欧":"eu","独":"de","仏":"fr","伊":"it","英":"gb","日":"jp","豪":"au","NZ":"nz","加":"ca","スイス":"ch","瑞":"ch","中":"cn","南ア":"za","トルコ":"tr","メキシコ":"mx"};
const flagImg=c=>CC[c]?`<img class="fl" src="https://flagcdn.com/w40/${CC[c]}.png" alt="${c}" width="22" height="15" loading="lazy">`:"";
const CUR={USD:"ドル",EUR:"ユーロ",GBP:"ポンド",JPY:"円",AUD:"豪ドル",NZD:"NZドル",CAD:"カナダドル",CHF:"フラン",CNY:"人民元",ZAR:"ランド",TRY:"リラ",MXN:"ペソ"};
const PAIRS={USD:"ドル円・ユーロドル",EUR:"ユーロドル・ユーロ円",GBP:"ポンドドル・ポンド円",JPY:"ドル円・クロス円",AUD:"豪ドル円・豪ドルドル",NZD:"NZドル円・NZドルドル",CAD:"ドルカナダ・カナダ円",CHF:"ドルフラン・ユーロフラン",CNY:"豪ドル・人民元",ZAR:"ランド円",TRY:"リラ円",MXN:"ペソ円"};
const RCLS={SS:1,S:1,AA:2,A:2,BB:3,B:3,C:4,"◎":2,"○":2,"△":3,"×":4};
const IMPORTANT=new Set(["SS","S","AA","A","◎","○"]);
const WD="日月火水木金土";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};

let INDEX={days:[]},EXPL={items:[],people:[]},DAY=null,cur=null,filter=store.get("fxcal.filter","all"),showPast=false;
const open=new Set();

const jstNow=()=>new Date(Date.now()+9*3600e3);
const ymdOf=d=>d.toISOString().slice(0,10);
// 羊飼い式: 7時前は前日扱い
const tradingDay=()=>{const n=jstNow();if(n.getUTCHours()<7)n.setUTCDate(n.getUTCDate()-1);return ymdOf(n)};
const num=s=>{const m=String(s??"").normalize("NFKC").replace(/,/g,"").match(/[-+]?\d+(\.\d+)?/);return m?parseFloat(m[0]):null};
const dash=v=>!v||/^[-ー－]+$/.test(String(v).trim());
const fmtDate=y=>{const d=new Date(y+"T00:00:00Z");return `${d.getUTCMonth()+1}/${d.getUTCDate()}(${WD[d.getUTCDay()]})`};

function explain(ev){
  const t=ev.title.replace(/^[^)）]{1,4}[)）]/,"");
  if(ev.kind==="speech"){const p=EXPL.people.find(x=>new RegExp(x.re).test(t));return p?{person:p}:null}
  const it=EXPL.items.find(x=>(!x.cc||x.cc.includes(ev.country))&&new RegExp(x.re,"i").test(t));
  return it?{item:it}:null;
}
// 結果の判定: 予想(無ければ前回)と比べて上/下
function judge(v){
  if(dash(v.actual))return null;
  const a=num(v.actual);if(a===null)return null;
  let base=dash(v.forecast)?null:num(v.forecast),vs="予想";
  if(base===null){base=dash(v.previous)?null:num(v.previous);vs="前回"}
  if(base===null)return{d:0,vs};
  const d=+(a-base).toFixed(4);
  return{d,vs,cls:d>0?"up":d<0?"dn":"",tag:d>0?`▲${vs}超え`:d<0?`▼${vs}未満`:`${vs}通り`};
}
function afterText(ev,ex){
  const v=ev.values[0];if(!v)return"";
  const j=judge(v);if(!j)return"";
  const c=CUR[ev.currency]||"";const dir=ex?.item?.dir??1;
  let s=`${j.vs}${esc(j.vs==="予想"?v.forecast:v.previous)}に対して結果は<b>${esc(v.actual)}</b>`;
  if(j.d===0)return s+"で、ほぼ予想通り。反応は限定的になりやすい内容です。";
  const diff=Math.abs(j.d);const big=Math.abs(num(v.forecast))>0?diff/Math.abs(num(v.forecast))>0.05:diff>=0.3;
  s+=`と${j.d>0?"上振れ":"下振れ"}(${j.d>0?"+":"−"}${+diff.toFixed(3)})。`;
  if(dir&&c){const buy=(j.d>0)===(dir>0);s+=`<b style="color:${buy?"var(--up)":"var(--dn)"}">${c}${buy?"買い":"売り"}材料</b>${big?"で、サプライズはやや大きめ":""}。`}
  return s;
}

function rankBadge(ev){
  if(ev.rank)return`<span class="rank r${RCLS[ev.rank]||0}" title="羊飼いの指標ランク">${esc(ev.rank)}</span>`;
  if(ev.mkImportance)return`<span class="rank r0" title="みんかぶの重要度(羊飼いのランク未取得)">★${ev.mkImportance}</span>`;
  return`<span class="rank r0">—</span>`;
}
function valsBlock(ev){
  if(!ev.values.length)return ev.memo?`<div class="memo">${esc(ev.memo)}</div>`:"";
  return`<div class="vals">`+ev.values.map((v,i)=>{
    const j=judge(v);const lab=ev.labels?.[i];
    return (lab&&ev.values.length>1?`<div class="lab">${esc(lab)}</div>`:"")+
      `<div><span class="k">予想</span><span class="v">${esc(v.forecast||"—")}</span></div>`+
      `<div><span class="k">前回</span><span class="v">${esc(v.previous||"—")}</span></div>`+
      `<div class="res ${j?.cls||""}"><span class="k">結果</span><span class="v">${esc(v.actual||"—")}</span>${j?.tag?`<span class="tag">${j.tag}</span>`:""}</div>`;
  }).join("")+`</div>`;
}
function kidsBlock(ev){
  if(!ev.children.length)return"";
  return`<div class="kids">`+ev.children.map(c=>{const j=judge(c);return`<div><span>↳ ${esc(c.title)}</span><span>${esc(c.forecast||"—")}</span><span>${esc(c.previous||"—")}</span><span class="${j?.cls||""}">${esc(c.actual||"—")}</span></div>`}).join("")+`</div>`;
}
function detailBlock(ev){
  const ex=explain(ev);let h="";
  if(ex?.item){const x=ex.item;
    h+=`<h4>内容</h4><p>${esc(x.about)}</p><h4>影響</h4><p>${esc(x.impact)}</p>`;
    if(x.watch)h+=`<h4>注目点</h4><p>${esc(x.watch)}</p>`;
  }else if(ex?.person){const p=ex.person;
    h+=`<h4>発言者</h4><p>${esc(p.role)}</p><h4>影響</h4><p>${esc(p.note)}</p>`;
    if(/投票権あり/.test(ev.title))h+=`<p style="margin-top:4px">今年の投票権を持つメンバーなので、発言の重みは大きめです。</p>`;
  }else{
    h+=`<h4>内容</h4><p style="color:var(--muted)">この項目の解説はまだありません。</p>`;
  }
  if(ev.currency&&PAIRS[ev.currency])h+=`<h4>主な対象</h4><p>${PAIRS[ev.currency]}</p>`;
  if(ev.prevMove)h+=`<h4>前回発表時の値動き</h4><p><span style="font-family:var(--mono);font-weight:600">${esc(ev.prevMove)}</span> <span style="color:var(--muted);font-size:11.5px">(みんかぶ調べ・発表直後の変動幅)</span></p>`;
  if(ev.links?.length)h+=`<h4>過去の発表時のチャート</h4><div class="links">${ev.links.map(l=>`<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.pair)}</a>`).join("")}</div>`;
  const at=afterText(ev,ex);
  if(at)h+=`<h4>結果のまとめ</h4><div class="after">${at}</div>`;
  return`<div class="detail">${h}</div>`;
}
function evCard(ev){
  const m=ev.title.match(/^([^)）]{1,4})[)）](.*)$/);
  const body=m?`<span class="cty">${esc(m[1])})</span>${esc(m[2])}`:esc(ev.title);
  return`<div class="ev ${ev.kind}${open.has(ev.id)?" open":""}" data-id="${esc(ev.id)}">
    <div class="head"><span class="flag">${flagImg(ev.country)}</span><div class="ttl e${ev.emphasis||0}">${body}</div>${rankBadge(ev)}<span class="more">▾</span></div>
    ${valsBlock(ev)}${kidsBlock(ev)}${detailBlock(ev)}</div>`;
}
const passes=ev=>filter==="all"||(filter==="imp"&&(IMPORTANT.has(ev.rank)||(!ev.rank&&ev.mkImportance>=4)))||(filter==="us"&&ev.country==="米")||(filter==="speech"&&(ev.kind==="speech"||ev.kind==="policy"));

function render(){
  const main=$("#main");
  $("#datelbl").innerHTML=`${cur===tradingDay()?"<b>今日</b>":""}${fmtDate(cur)}`;
  const i=INDEX.days.indexOf(cur);
  $("#prev").disabled=i<=0;$("#nextd").disabled=i<0||i>=INDEX.days.length-1;
  if(!DAY){main.innerHTML=`<div class="empty">この日のデータはまだありません。</div>`;$("#next").hidden=true;return}
  if(DAY.sourceUrl)$("#srclink").href=DAY.sourceUrl;
  const now=Date.now();
  const evs=DAY.events.filter(passes);
  const groups=[];for(const ev of evs){const g=groups.at(-1);if(g&&g.time===ev.time)g.list.push(ev);else groups.push({time:ev.time,at:ev.at,list:[ev]})}
  const doneOf=g=>new Date(g.at).getTime()+30*60e3<now&&g.list.every(e=>e.kind==="speech"||e.kind==="auction"||!e.values.length||e.values.every(v=>!dash(v.actual)));
  const nextG=groups.find(g=>new Date(g.at).getTime()>now-5*60e3);
  let past=groups.filter(g=>g!==nextG&&doneOf(g)&&new Date(g.at)<new Date(nextG?.at||8.64e15));
  let h="";
  if(DAY.notes?.length)h+=`<div class="notes">${DAY.notes.map(n=>`<div>${esc(n)}</div>`).join("")}</div>`;
  if(DAY.source==="minkabu")h+=`<p class="src">※ 羊飼いのランクが未取得のため、みんかぶの重要度(★)で表示しています。</p>`;
  if(past.length&&!showPast)h+=`<div class="pastbar"><button id="showpast">発表済み ${past.reduce((a,g)=>a+g.list.length,0)}件を表示</button></div>`;
  for(const g of groups){
    if(!showPast&&past.includes(g))continue;
    const [hh,mm]=g.time.split(":").map(Number);
    const sub=hh>=24?`<small>翌${hh-24}:${String(mm).padStart(2,"0")}</small>`:"";
    const cls=past.includes(g)||new Date(g.at).getTime()+30*60e3<now?"past":g===nextG?"now":"";
    h+=`<section class="grp ${cls}"><div class="tm">${g.time}${sub}</div><div class="evs">${g.list.map(evCard).join("")}</div></section>`;
  }
  if(!groups.length)h+=`<div class="empty">該当する項目はありません。</div>`;
  main.innerHTML=h;
  $("#showpast")?.addEventListener("click",()=>{showPast=true;render()});
  tick();
}
function tick(){
  const el=$("#next");
  if(!DAY||cur!==tradingDay()){el.hidden=true;return}
  const now=Date.now();
  const ev=DAY.events.filter(passes).find(e=>new Date(e.at).getTime()>now);
  if(!ev){el.hidden=false;el.innerHTML=`<span class="nt" style="color:var(--muted)">本日の予定はすべて終了しました</span>`;return}
  const s=Math.max(0,Math.floor((new Date(ev.at).getTime()-now)/1000));
  const cd=s>=3600?`${Math.floor(s/3600)}:${String(Math.floor(s%3600/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`:`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;
  const same=DAY.events.filter(e=>e.at===ev.at&&passes(e));
  el.hidden=false;
  el.innerHTML=`<span class="cd">${cd}</span><span class="nt"><span class="lbl">次の発表 ${ev.time}</span>${flagImg(ev.country)} ${esc(ev.title)}${same.length>1?` ほか${same.length-1}件`:""}</span>${rankBadge(ev)}`;
}
async function getJSON(u){const r=await fetch(u+(u.includes("?")?"&":"?")+"t="+Math.floor(Date.now()/60000),{cache:"no-store"});if(!r.ok)throw new Error(r.status);return r.json()}
// ---- SBI FXトレードから結果を直接読む (発表前後は15秒ごと) ----
let LIVE=[],lastLive=0;
const addDays=(y,n)=>{const d=new Date(y+"T00:00:00Z");d.setUTCDate(d.getUTCDate()+n);return ymdOf(d)};
function applyLive(){if(DAY&&LIVE.length)return applyRows(DAY,LIVE);return false}
function liveWindow(){
  if(!DAY||cur!==tradingDay())return false;
  const now=Date.now();
  return DAY.events.some(e=>e.kind!=="speech"&&e.values.length&&now>new Date(e.at).getTime()-60e3&&now<new Date(e.at).getTime()+45*60e3&&e.values.some(v=>dash(v.actual)));
}
async function pollLive(force){
  if(!DAY||cur!==tradingDay())return;
  const now=Date.now();
  if(!force&&now-lastLive<(liveWindow()?15e3:5*60e3))return;
  lastLive=now;
  try{
    const r=await fetch(sbiUrl(addDays(cur,-1),addDays(cur,1)),{cache:"no-store"});
    if(!r.ok)return;
    LIVE=parseSbi(await r.json());
    if(applyLive())render();
  }catch{}
}
async function loadDay(y){
  cur=y;showPast=y<tradingDay(); // 過去の日は最初から全部表示
  try{DAY=await getJSON(`data/days/${y}.json`)}catch{DAY=null}
  applyLive();
  render();
  pollLive(true);
}
function renderFilters(){
  const F=[["all","すべて"],["imp","重要のみ"],["us","米国"],["speech","要人・金融政策"]];
  $("#filters").innerHTML=F.map(([k,l])=>`<button class="chip${filter===k?" on":""}" data-f="${k}">${l}</button>`).join("");
}
$("#filters").addEventListener("click",e=>{const b=e.target.closest("[data-f]");if(!b)return;filter=b.dataset.f;store.set("fxcal.filter",filter);renderFilters();render()});
$("#main").addEventListener("click",e=>{const h=e.target.closest(".head");if(!h||e.target.closest("a"))return;const c=h.parentElement;const id=c.dataset.id;open.has(id)?open.delete(id):open.add(id);c.classList.toggle("open")});
$("#prev").addEventListener("click",()=>{const i=INDEX.days.indexOf(cur);if(i>0)loadDay(INDEX.days[i-1])});
$("#nextd").addEventListener("click",()=>{const i=INDEX.days.indexOf(cur);if(i>=0&&i<INDEX.days.length-1)loadDay(INDEX.days[i+1])});
$("#datelbl").addEventListener("click",()=>loadDay(pickDay()));
function pickDay(){const t=tradingDay();if(INDEX.days.includes(t))return t;return INDEX.days.find(d=>d>t)||INDEX.days.at(-1)||t}
(async()=>{
  renderFilters();
  try{[INDEX,EXPL]=await Promise.all([getJSON("data/index.json"),getJSON("data/explain.json")])}catch(e){$("#main").innerHTML=`<div class="empty">データを読み込めませんでした</div>`;return}
  if(INDEX.updated){const d=new Date(new Date(INDEX.updated).getTime()+9*3600e3);$("#upd").textContent=`更新 ${d.getUTCMonth()+1}/${d.getUTCDate()} ${String(d.getUTCHours()).padStart(2,"0")}:${String(d.getUTCMinutes()).padStart(2,"0")}`}
  await loadDay(pickDay());
  setInterval(tick,1000);
  setInterval(()=>pollLive(false),5e3);
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)pollLive(true)});
  // 1分ごとに再取得 (結果の反映)
  setInterval(async()=>{try{const d=await getJSON(`data/days/${cur}.json`);applyRows(d,LIVE);if(JSON.stringify(d)!==JSON.stringify(DAY)){DAY=d;render()}}catch{}},60e3);
  let lastTd=tradingDay();setInterval(()=>{const t=tradingDay();if(t!==lastTd){lastTd=t;getJSON("data/index.json").then(x=>{INDEX=x;loadDay(pickDay())}).catch(()=>{})}},60e3);
})();
</script>
