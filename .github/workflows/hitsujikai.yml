name: 羊飼いのランク・予定を取り込み
on:
  schedule:
    # 日本時間 7:00 (朝の更新後) / 15:30・17:30・19:30 (予想値の更新後)
    - cron: "0 22 * * *"
    - cron: "30 6,8,10 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/hitsujikai.mjs
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "羊飼いのランク・予定を取り込み" && git pull --rebase && git push)
